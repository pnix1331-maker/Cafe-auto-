<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=5" />
<meta name="theme-color" content="#090a0f" />
<meta name="color-scheme" content="dark" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Jarvis POS · Smart QR Ordering & Owner Tab</title>

<!-- Optional Cloud WebSocket Relay (MQTT over WSS) for Cross-Device Phone-to-Tab Sync -->
<script src="https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js" defer></script>

<style>
  *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#090a0f;
    --surface:rgba(255,255,255,.04);
    --surface-2:rgba(255,255,255,.07);
    --surface-3:rgba(255,255,255,.11);
    --line:rgba(255,255,255,.08);
    --line-2:rgba(255,255,255,.16);
    --text:#f8fafc;
    --muted:#94a3b8;
    --dim:#64748b;
    --accent:#6366f1;
    --accent-2:#06b6d4;
    --accent-3:#a855f7;
    --success:#10b981;
    --warn:#f59e0b;
    --danger:#ef4444;
    --radius:16px;
    --radius-sm:11px;
    --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Inter',sans-serif;
    --font-mono:ui-monospace,'SF Mono',Menlo,monospace;
  }
  html,body{margin:0;padding:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  input,select,textarea,button{font-family:inherit;font-size:15px}
  button{cursor:pointer;border:none;background:none;color:inherit;padding:0;user-select:none}

  /* Ambient Orbs */
  .bg-orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.25}
  .orb-1{width:480px;height:480px;background:radial-gradient(circle,var(--accent),transparent 70%);top:-150px;left:-100px}
  .orb-2{width:420px;height:420px;background:radial-gradient(circle,var(--accent-2),transparent 70%);bottom:-140px;right:-80px}

  /* Top Mode Bar (Hidden when customer scans QR with &qr=1) */
  .seller-bar{
    position:sticky;top:0;z-index:100;
    background:rgba(9,10,15,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid var(--line);padding:8px 14px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap
  }
  .seller-bar.hidden{display:none!important}
  .mode-pills{display:flex;gap:6px;flex-wrap:wrap}
  .mpill{
    padding:7px 13px;border-radius:999px;font-size:12px;font-weight:600;
    background:var(--surface-2);border:1px solid var(--line);color:var(--muted);
    display:inline-flex;align-items:center;gap:6px;transition:.15s
  }
  .mpill.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent;box-shadow:0 3px 12px rgba(99,102,241,.35)}
  .sync-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 8px var(--success)}
  .dot.warn{background:var(--warn);box-shadow:0 0 8px var(--warn)}
  .dot.off{background:var(--danger);box-shadow:0 0 8px var(--danger)}

  /* Main Container & Mode Routing */
  .app-shell{max-width:1320px;margin:0 auto;padding:14px;position:relative;z-index:1}
  .view-grid{display:grid;gap:18px}
  body[data-mode="guest"] .owner-panel{display:none!important}
  body[data-mode="guest"] .view-grid{max-width:460px;margin:0 auto}
  body[data-mode="owner"] .guest-panel{display:none!important}
  body[data-mode="split"] .view-grid{grid-template-columns:1fr}
  @media(min-width:960px){
    body[data-mode="split"] .view-grid{grid-template-columns:410px 1fr;align-items:start}
  }

  .glass{
    background:var(--surface);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:0 12px 36px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05)
  }

  /* ================= GUEST MOBILE WEB VIEW ================= */
  .guest-panel{overflow:hidden;padding-bottom:80px;position:relative}
  .guest-hero{
    padding:20px 18px 16px;
    background:linear-gradient(180deg,rgba(99,102,241,.18),transparent);
    border-bottom:1px solid var(--line);text-align:center
  }
  .rest-badge{
    display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;
    background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.3);
    color:#22d3ee;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px
  }
  .guest-hero h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
  .guest-hero p{margin:4px 0 0;font-size:12px;color:var(--muted)}
  .table-bar{
    margin-top:12px;display:inline-flex;align-items:center;gap:8px;
    background:var(--surface-2);padding:5px 12px;border-radius:10px;border:1px solid var(--line);font-size:12px
  }
  .table-bar select{background:transparent;color:var(--text);border:none;font-weight:700;font-size:13px;outline:none}
  .table-bar select option{background:#11131c;color:#fff}

  /* Guest Navigation Sub-tabs */
  .g-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:12px 14px 4px}
  .g-nav-btn{
    padding:10px 8px;border-radius:10px;font-size:12.5px;font-weight:700;
    background:var(--surface-2);border:1px solid var(--line);color:var(--muted);
    display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s
  }
  .g-nav-btn.active{background:rgba(99,102,241,.2);color:#fff;border-color:var(--accent)}
  .g-sec{display:none;padding:12px 14px}
  .g-sec.active{display:block}

  /* Quick Service Grid */
  .quick-service-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
  .qs-btn{
    padding:12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);
    display:flex;align-items:center;gap:10px;text-align:left;font-weight:600;font-size:13px;
    transition:transform .12s,background .15s
  }
  .qs-btn:active{transform:scale(.97);background:var(--surface-3)}
  .qs-ico{
    width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-size:18px;background:rgba(255,255,255,.05);flex-shrink:0
  }
  .qs-btn small{display:block;font-size:10.5px;color:var(--muted);font-weight:400;margin-top:2px}

  /* Voice & Custom AI Bar */
  .ai-box{
    background:linear-gradient(135deg,rgba(99,102,241,.12),rgba(6,182,212,.09));
    border:1px solid rgba(99,102,241,.3);border-radius:13px;padding:12px;margin-bottom:14px
  }
  .ai-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  .ai-top span{font-size:12px;font-weight:700;color:#c7d2fe}
  .mic-btn{
    padding:7px 13px;border-radius:999px;background:var(--accent);color:#fff;
    font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;
    box-shadow:0 4px 12px rgba(99,102,241,.4)
  }
  .mic-btn.rec{background:var(--danger);animation:pulse 1.1s infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 8px rgba(239,68,68,.2)}}
  .ai-input-row{display:flex;gap:6px}
  .ai-input-row input{
    flex:1;background: rgba(0,0,0,.35);border:1px solid var(--line);
    border-radius:9px;padding:10px 12px;color:#fff;font-size:13px;outline:none
  }
  .ai-input-row button{
    padding:0 15px;border-radius:9px;background:var(--surface-3);border:1px solid var(--line-2);
    font-weight:700;font-size:12.5px;color:#fff
  }

  /* Menu Categories & Items */
  .cat-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px;scrollbar-width:none}
  .cat-bar::-webkit-scrollbar{display:none}
  .cat-chip{
    padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;
    background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap
  }
  .cat-chip.active{background:#fff;color:#090a0f;border-color:#fff}

  .menu-list{display:flex;flex-direction:column;gap:9px}
  .menu-card{
    background:var(--surface-2);border:1px solid var(--line);border-radius:12px;
    padding:12px;display:flex;align-items:center;justify-content:space-between;gap:12px
  }
  .veg-dot{
    display:inline-flex;width:13px;height:13px;border:1.5px solid var(--success);
    align-items:center;justify-content:center;border-radius:3px;margin-right:5px;vertical-align:middle
  }
  .veg-dot::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--success)}
  .veg-dot.nonveg{border-color:var(--danger)}
  .veg-dot.nonveg::after{background:var(--danger)}
  .m-title{font-weight:700;font-size:14px;color:var(--text)}
  .m-desc{font-size:11.5px;color:var(--muted);margin-top:2px}
  .m-price{font-weight:800;font-size:13.5px;color:#38bdf8;margin-top:5px;font-family:var(--font-mono)}

  .qty-ctrl{
    display:inline-flex;align-items:center;background:var(--surface-3);
    border:1px solid var(--line-2);border-radius:9px;overflow:hidden;flex-shrink:0
  }
  .qty-btn{width:32px;height:32px;font-weight:800;font-size:16px;color:#fff;display:flex;align-items:center;justify-content:center}
  .qty-val{min-width:24px;text-align:center;font-weight:700;font-size:13px;font-family:var(--font-mono)}
  .add-btn{
    padding:7px 16px;border-radius:9px;background:rgba(99,102,241,.18);
    border:1px solid var(--accent);color:#c7d2fe;font-weight:700;font-size:12.5px
  }

  /* Sticky Guest Cart Footer */
  .cart-bar{
    position:sticky;bottom:10px;margin:10px 14px 0;
    background:linear-gradient(135deg,var(--accent),#4f46e5);
    border-radius:14px;padding:12px 16px;color:#fff;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    box-shadow:0 12px 28px rgba(79,70,229,.55);z-index:20
  }
  .cart-bar.hidden{display:none}
  .cart-info b{display:block;font-size:14px}
  .cart-info span{font-size:11.5px;opacity:.9}
  .cart-submit{
    background:#fff;color:#1e1b4b;padding:9px 16px;border-radius:10px;
    font-weight:800;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.2)
  }

  /* Guest Live Orders & Bill View */
  .bill-box{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .bill-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px dashed var(--line)}
  .bill-total{display:flex;justify-content:space-between;padding-top:10px;font-size:16px;font-weight:800;color:#34d399}
  .upi-btn{
    width:100%;margin-top:12px;padding:12px;border-radius:11px;
    background:linear-gradient(135deg,#059669,#10b981);color:#fff;
    font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px
  }

  /* ================= OWNER NOTIFICATION TAB ================= */
  .owner-panel{padding:18px;display:flex;flex-direction:column;gap:16px}
  .owner-header{
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    padding-bottom:14px;border-bottom:1px solid var(--line)
  }
  .owner-title h2{margin:0;font-size:19px;font-weight:800;display:flex;align-items:center;gap:9px}
  .owner-title p{margin:3px 0 0;font-size:12px;color:var(--muted)}
  .owner-actions{display:flex;gap:8px;flex-wrap:wrap}

  .btn{
    padding:9px 14px;border-radius:10px;font-size:12.5px;font-weight:700;
    background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    display:inline-flex;align-items:center;gap:6px;transition:.15s
  }
  .btn:hover{background:var(--surface-3)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff}
  .btn.sound-off{background:linear-gradient(135deg,#991b1b,#ef4444);border-color:transparent;color:#fff;animation:pulse 2s infinite}
  .btn.sound-on{background:linear-gradient(135deg,#065f46,#10b981);border-color:transparent;color:#fff}

  /* KPI Stats */
  .kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media(min-width:640px){.kpi-grid{grid-template-columns:repeat(4,1fr)}}
  .kpi{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .kpi span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
  .kpi b{display:block;font-size:22px;font-weight:800;margin-top:4px;font-family:var(--font-mono)}
  .kpi.k-pend b{color:#fbbf24}
  .kpi.k-prep b{color:#818cf8}
  .kpi.k-rev b{color:#34d399}
  .kpi.k-chat b{color:#22d3ee}

  /* Owner Inner Layout */
  .owner-Workspace{display:grid;gap:16px;grid-template-columns:1fr}
  @media(min-width:1100px){.owner-Workspace{grid-template-columns:1.4fr .9fr}}

  /* KDS Ticket Feed */
  .kds-box{display:flex;flex-direction:column;gap:10px}
  .filter-tabs{display:flex;gap:6px;flex-wrap:wrap}
  .ftab{
    padding:7px 13px;border-radius:8px;font-size:12px;font-weight:700;
    background:var(--surface-2);border:1px solid var(--line);color:var(--muted)
  }
  .ftab.active{border-color:var(--accent);color:#fff;background:rgba(99,102,241,.18)}

  .ticket-list{display:flex;flex-direction:column;gap:10px;max-height:580px;overflow-y:auto;padding-right:4px}
  .ticket{
    background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--accent);
    border-radius:13px;padding:14px;animation:slideIn .25s ease-out
  }
  @keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
  .ticket.food_order{border-left-color:#a855f7}
  .ticket.water{border-left-color:#22d3ee}
  .ticket.service_call{border-left-color:#f59e0b}
  .ticket.bill{border-left-color:#10b981}
  .ticket.done{opacity:.55}

  .t-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap}
  .t-table{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
  .badge{
    font-size:10px;font-weight:800;text-transform:uppercase;padding:3px 8px;border-radius:6px;
    background:var(--surface-3);color:var(--muted)
  }
  .badge.pending{background:rgba(245,158,11,.2);color:#fbbf24}
  .badge.acknowledged{background:rgba(99,102,241,.22);color:#a5b4fc}
  .badge.done{background:rgba(16,185,129,.2);color:#34d399}

  .t-items{margin:10px 0;padding:9px 12px;background:rgba(0,0,0,.28);border-radius:9px;font-size:13px}
  .t-item-row{display:flex;justify-content:space-between;padding:3px 0}
  .t-total{border-top:1px solid var(--line);margin-top:6px;padding-top:6px;font-weight:800;color:#34d399;display:flex;justify-content:space-between}
  .t-hindi{font-size:11.5px;color:var(--muted);font-style:italic;margin-top:6px}
  .t-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .t-btn{padding:8px 13px;border-radius:8px;font-size:11.5px;font-weight:800;text-transform:uppercase;color:#fff}
  .t-btn.ack{background:#d97706}
  .t-btn.done{background:#059669}
  .t-btn.speak{background:var(--surface-3);color:var(--text);border:1px solid var(--line-2)}

  /* Chat Box */
  .chat-card{
    background:var(--surface-2);border:1px solid var(--line);border-radius:13px;
    display:flex;flex-direction:column;height:420px;overflow:hidden
  }
  .chat-head{padding:11px 14px;border-bottom:1px solid var(--line);font-weight:700;display:flex;justify-content:space-between;align-items:center}
  .chat-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
  .bub{max-width:82%;padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.4}
  .bub.in{align-self:flex-start;background:var(--surface-3);border:1px solid var(--line)}
  .bub.out{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent-3));color:#fff}
  .bub.sys{align-self:center;font-size:11px;color:var(--muted);font-style:italic}
  .bub small{display:block;font-size:9.5px;opacity:.65;margin-top:3px}
  .chat-foot{padding:9px;border-top:1px solid var(--line);display:flex;gap:6px}
  .chat-foot input{flex:1;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:#fff;outline:none}
  .chat-foot button{padding:0 15px;border-radius:8px;background:var(--accent);color:#fff;font-weight:700}

  /* Modals (White-Label Customizer & QR Studio) */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(8px);
    z-index:200;display:none;align-items:center;justify-content:center;padding:16px
  }
  .modal-backdrop.open{display:flex}
  .modal{
    background:#11131d;border:1px solid var(--line-2);border-radius:18px;
    max-width:680px;width:100%;max-height:88vh;overflow-y:auto;padding:20px;
    box-shadow:0 24px 60px rgba(0,0,0,.75)
  }
  .modal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
  .modal-top h3{margin:0;font-size:17px}
  .form-grid{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-bottom:14px}
  .form-group{display:flex;flex-direction:column;gap:4px}
  .form-group label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase}
  .form-group input{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:#fff;font-size:13px}

  .qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px;margin-top:12px}
  .qr-item{background:#fff;color:#090a0f;border-radius:12px;padding:12px;text-align:center}
  .qr-item img{width:100%;max-width:125px;height:auto;display:block;margin:0 auto 6px}
  .qr-item b{display:block;font-size:13px}
  .qr-item a{font-size:11px;color:#4f46e5;font-weight:700;text-decoration:none}

  /* Toasts */
  .toasts{position:fixed;top:14px;right:14px;z-index:9999;display:flex;flex-direction:column;gap:8px;max-width:320px;pointer-events:none}
  .toast{background:rgba(17,19,29,.96);border:1px solid var(--line-2);border-left:4px solid var(--accent);padding:11px 14px;border-radius:10px;font-size:12.5px;box-shadow:0 10px 28px rgba(0,0,0,.6)}
</style>
</head>
<body data-mode="split">

<div class="bg-orbs" aria-hidden="true">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
</div>

<!-- TOP BAR: Switch between Customer QR Page, Owner Tab, or Split-Screen Pitch -->
<nav class="seller-bar" id="sellerBar">
  <div class="mode-pills">
    <button class="mpill" data-setmode="guest">📱 Customer QR Web Page</button>
    <button class="mpill" data-setmode="owner">🖥️ Owner Notification Tab</button>
    <button class="mpill active" data-setmode="split">⚡ Split-Screen Live Pitch</button>
  </div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <div class="sync-badge"><span class="dot" id="syncDot"></span><span id="syncText">Multi-Tab Live Sync</span></div>
    <button class="btn" id="btnOpenOwnerTab" title="Open Owner Tab in a separate window">↗ Open Owner Tab</button>
    <button class="btn" id="btnCustomize">⚙️ Customize Restaurant</button>
    <button class="btn primary" id="btnQrStudio">🖨️ Table QR Codes</button>
  </div>
</nav>

<main class="app-shell">
  <div class="view-grid">

    <!-- ===================================================================== -->
    <!-- 1. CUSTOMER QR WEB PAGE (What the guest sees when scanning Table QR)  -->
    <!-- ===================================================================== -->
    <section class="guest-panel glass" aria-label="Customer QR Ordering Web Page">
      <div class="guest-hero">
        <div class="rest-badge">✨ Instant Table Service · No App Needed</div>
        <h1 id="gRestName">The Royal Spice Bistro</h1>
        <p id="gRestTag">Scan · Order Food · Call Steward Instantly</p>
        <div class="table-bar">
          <span>📍 Sitting at</span>
          <select id="gTableSel" aria-label="Select Table">
            <option value="1">Table 1</option>
            <option value="2" selected>Table 2</option>
            <optio
